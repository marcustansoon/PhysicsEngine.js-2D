<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg.wasm - Merge Video + Audio</title>
    <style>
        button { margin: 8px 0; padding: 12px 20px; font-size: 16px; cursor: pointer; }
        input[type="file"] { margin: 10px 0; display: block; }
        #log-div {
            margin-top: 15px;
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 12px;
            min-height: 200px;
            border: 1px solid #ddd;
            font-family: monospace;
            overflow-y: auto;
        }
        video { max-width: 100%; margin: 15px 0; background: #000; }
        .success { color: green; }
        .error { color: red; }
        .status { color: #0066cc; }
    </style>
    <style>
        body {
          font-family: 'Source Sans Pro';
          height: 100vh;
          margin: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
    
        .progress-wrapper {
          width: 80%;
          max-width: 500px;
          text-align: center;
        }
    
        .progress-title {
          font-size: 22px;
          font-weight: 600;
          color: #333;
          margin-bottom: 15px;
        }
    
        .progress-bar {
          height: 30px;
          background: #e0e0e0;
          border-radius: 50px;
          /*overflow: hidden;*/
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    
        .progress {
          height: 100%;
          background: linear-gradient(90deg, #ff5f6d, #ff0000);
          width: 0%;                    /* JS will control this */
          transition: width 0.8s ease;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-weight: bold;
          font-size: 16px;
          text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
    </style>
    <link rel="stylesheet" href="liquid.css">
</head>
<body>

    <div class="liquid-bg" style="blur: 5px;filter: blur(15px);">
      <span></span>
      <span></span>
      <span></span>
    </div>
    
  <div class="progress-wrapper">
    <div id="progress-title" class="progress-title"></div>
    <div class="progress-bar">
      <div id="progress" class="progress"><div id="progress-text" style="position: absolute; left: 0; width: 100%;">0%</div></div>
    </div>
    <div style="color: red;padding: 5px;white-space: pre-wrap;word-break: break-word;overflow-wrap: anywhere;" id="progress-err-text"></div>
    <div style="color: green;padding: 5px;white-space: pre-wrap;word-wrap: break-word;overflow-wrap: break-word;" id="progress-done-text"></div>
  </div>
  <div style=" font-size: small; position: absolute; bottom: 0; padding: 30px; text-align: center; ">Please keep your screen on while the video is processing</div>
    
<div style="display:none">
    <h1>FFmpeg.wasm: Merge Video + Audio → MP4</h1>
    <video id="video-result" controls></video><br><br>
    
    <h3>Step 1: Load FFmpeg</h3>
    <button id="load-button">Load FFmpeg (~31 MB)</button><br><br>
    
    <h3>Step 2: Select Files</h3>
    <label>Video File (MP4, WebM, MOV...):<br>
        <input type="file" id="video-input" accept="video/*">
    </label><br><br>
    
    <label>Audio File (M4A, MP3, WAV, AAC...):<br>
        <input type="file" id="audio-input" accept="audio/*">
    </label><br><br>
    
    <button disabled id="merge-button">Merge Video + Audio → MP4</button><br>
    
    <div id="log-div">Click "Load FFmpeg" to start.</div>

</div>

<!-- Local FFmpeg -->
<script src="ffmpeg.min.js"></script>
<script>
    "use strict";
    
    // New chunk size
    const chunkSize = 1024 * 512; // 512 KB
    let vd;
    let ad;
    let folderPath = "";
    let videoFileName = "";
    let audioFileName = "";
    let audioExists = false;
    let isFetchDataReady = false;
    let isLibLoaded = false;
    let mergeStarted = false;

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    async function getVideoFileName(){
        if(!window.flutter_inappwebview?.callHandler) return '';
        return await window.flutter_inappwebview.callHandler('getVideoFileName');
    }
    
    async function getAudioFileName(){
        if(!window.flutter_inappwebview?.callHandler) return '';
        return await window.flutter_inappwebview.callHandler('getAudioFileName');
    }
    
    async function fetchVideoFile() {
        if(!window.flutter_inappwebview?.callHandler) return {'status': 400};
        
        videoFileName = await getVideoFileName();
        
        // Ask for file size (video)
        const videoSize = await window.flutter_inappwebview.callHandler('getFileSize', 'video');
        console.log('[Finalizer] video file=' + videoFileName + ' size=' + videoSize);
        if(!Number.isFinite(Number(videoSize)) || Number(videoSize) <= 0) {
            return {'status': 400, 'error': 'Video file is missing or has an invalid size: ' + videoSize};
        }
        const totalChunks = Math.ceil(videoSize / chunkSize);

        let fullArray;
        try {
            fullArray = new Uint8Array(videoSize);
        } catch(e) {
            console.error('[Finalizer] video buffer allocation failed size=' + videoSize, e);
            return {'status': 400, 'error': 'Could not allocate memory for the video (' + videoSize + ' bytes): ' + String(e)};
        }
        const maxRetries = 50;
        let retriesCount = 0;
    
        for (let i = 0; i < totalChunks; i++) {
            retriesCount = 0;
            while(retriesCount < maxRetries){
                try{
                    const start = i * chunkSize;
                    const end = Math.min(start + chunkSize, videoSize);
                    const url = `${videoFileName}?start=${start}&end=${end}`;
                  
                    const response = await fetch(url);
                    if(!response.ok) {
                        throw new Error('HTTP ' + response.status + ' ' + response.statusText);
                    }
                    const buffer = await response.arrayBuffer();
                    const bytes = new Uint8Array(buffer);
                    const expectedLength = end - start;
                    if(bytes.length !== expectedLength) {
                        throw new Error('Expected ' + expectedLength + ' bytes but received ' + bytes.length);
                    }

                    fullArray.set(bytes, start);
                    if(i === 0 || i === totalChunks - 1) {
                        console.log('[Finalizer] video chunk ' + i + '/' + totalChunks + ' start=' + start + ' end=' + end + ' bytes=' + bytes.length);
                    }
                    await delay(25);

                    break;
                }catch(e){
                    retriesCount++;
                    console.error('[Finalizer] video chunk failed index=' + i + ' retry=' + retriesCount + ' error=' + String(e));
                    await delay(1000);
                    if(retriesCount >= maxRetries){
                        return {'status': 400, 'error': 'Video chunk ' + i + ' failed after ' + maxRetries + ' attempts: ' + String(e)};
                    }
                }
            }
            updateProgressBar("video-download", (i+1) / totalChunks);
        }
        return {'data': fullArray, 'status': 200};
    }

    async function fetchAudioFile() {
        if(!window.flutter_inappwebview?.callHandler) return {'status': 400};
        
        audioFileName = await getAudioFileName();
        
        // Ask for file size (audio)
        const audioSize = await window.flutter_inappwebview.callHandler('getFileSize', 'audio');
        console.log('[Finalizer] audio file=' + audioFileName + ' size=' + audioSize);
        if(!Number.isFinite(Number(audioSize)) || Number(audioSize) <= 0) {
            return {'status': 400, 'error': 'Audio file is missing or has an invalid size: ' + audioSize};
        }
        const totalChunks = Math.ceil(audioSize / chunkSize);

        let fullArray;
        try {
            fullArray = new Uint8Array(audioSize);
        } catch(e) {
            console.error('[Finalizer] audio buffer allocation failed size=' + audioSize, e);
            return {'status': 400, 'error': 'Could not allocate memory for the audio (' + audioSize + ' bytes): ' + String(e)};
        }
        const maxRetries = 50;
        let retriesCount = 0;
    
        for (let i = 0; i < totalChunks; i++) {
            retriesCount = 0;
            while(retriesCount < maxRetries){
                try{
                    const start = i * chunkSize;
                    const end = Math.min(start + chunkSize, audioSize);
                    const url = `${audioFileName}?start=${start}&end=${end}`;
                  
                    const response = await fetch(url);
                    if(!response.ok) {
                        throw new Error('HTTP ' + response.status + ' ' + response.statusText);
                    }
                    const buffer = await response.arrayBuffer();
                    const bytes = new Uint8Array(buffer);
                    const expectedLength = end - start;
                    if(bytes.length !== expectedLength) {
                        throw new Error('Expected ' + expectedLength + ' bytes but received ' + bytes.length);
                    }

                    fullArray.set(bytes, start);
                    if(i === 0 || i === totalChunks - 1) {
                        console.log('[Finalizer] audio chunk ' + i + '/' + totalChunks + ' start=' + start + ' end=' + end + ' bytes=' + bytes.length);
                    }
                    await delay(25);

                    break;
                }catch(e){
                    retriesCount++;
                    console.error('[Finalizer] audio chunk failed index=' + i + ' retry=' + retriesCount + ' error=' + String(e));
                    await delay(1000);
                    if(retriesCount >= maxRetries){
                        return {'status': 400, 'error': 'Audio chunk ' + i + ' failed after ' + maxRetries + ' attempts: ' + String(e)};
                    }
                }
            }
            updateProgressBar("audio-download", (i+1) / totalChunks);
        }
        return {'data': fullArray, 'status': 200};
    }
    
    async function isAudioExists() {
        if(!window.flutter_inappwebview?.callHandler) return false;
        
        // Ask for file size (audio)
        let value = await window.flutter_inappwebview.callHandler('isAudioExists');
        
        return (isNaN(parseInt(value)) ? 0 : parseInt(value)) === 1 ? true : false;
    }

    async function getFolderPath() {
        if(!window.flutter_inappwebview?.callHandler) return false;
        return await window.flutter_inappwebview.callHandler('getFolderPath');
    }

    
    async function fetchVideoAndAudioFiles(){
        folderPath = await getFolderPath();
        audioExists = await isAudioExists();
        
        updateProgressTitle("Processing video...");
        let _vd = await fetchVideoFile();

        if(_vd.status === 400){
            const message = _vd.error || "There was an error processing the video. Please try again.";
            console.error('[Finalizer] video fetch failed: ' + message);
            updateProgressErrText(message);
            return;
        }
        vd = _vd.data;
        
        if(audioExists){
            updateProgressTitle("Processing audio...");
            let _ad = await fetchAudioFile();
            if(_ad.status === 400){
                const message = _ad.error || "There was an error processing the audio. Please try again.";
                console.error('[Finalizer] audio fetch failed: ' + message);
                updateProgressErrText(message);
                return;
            }
            ad = _ad.data;
        } else {
            updateProgressBar("audio-download", 1);
        }
        isFetchDataReady = true;
        checkForMergeReady();
    }

    function checkForMergeReady(){
        if(!isLibLoaded){
            updateProgressTitle("Loading utilities...");
            return;
        }

        if(isFetchDataReady && !mergeStarted) {
            mergeStarted = true;
            updateProgressTitle("Preparing merge...");
            mergeVideoAndAudio();
        }
    }

    
    async function sendMergedVideoToFlutter(outputData) {
        updateProgressTitle("Finalizing video...");
        if (!window.flutter_inappwebview?.callHandler) return;
    
        await window.flutter_inappwebview.callHandler('readyToSendChunk');
    
        const totalChunks = Math.ceil(outputData.length / chunkSize);
    
        function uint8ToBase64(uint8Array) {
            let binary = '';
            const sliceSize = 0x8000; // 32 KB
            for (let i = 0; i < uint8Array.length; i += sliceSize) {
                const subArray = uint8Array.subarray(i, i + sliceSize);
                binary += String.fromCharCode(...subArray);
            }
            return btoa(binary);
        }
    
        for (let i = 0; i < totalChunks; i++) {
            const start = i * chunkSize;
            const end = Math.min(start + chunkSize, outputData.length);
            const chunk = outputData.slice(start, end);
            const base64Chunk = uint8ToBase64(chunk);
    
            await window.flutter_inappwebview.callHandler('receiveMp4Chunk', {
                index: i,
                total: totalChunks,
                data: base64Chunk,
            });
    
            updateProgressBar("video-upload", (i + 1) / totalChunks);
    
            await delay(25); // small delay to avoid UI freezing
        }
    
        updateProgressTitle("Saving final video...");
        await window.flutter_inappwebview.callHandler('receiveMp4Done');
        updateProgressTitle("Video processed successfully");
        updateProgressDoneText("File saved to " + folderPath + "/output_merged.mp4");
    }
    

    let ffmpeg = null;
    let loadBtn, mergeBtn, logDiv, videoEl;
    let selectedVideoFile = null;
    let selectedAudioFile = null;
    
    const log = (msg, type='') => {
        console.log(msg);
        let cls = 'status', prefix = '';
        if(type==='success'){ cls='success'; prefix='✅ '; }
        if(type==='error'){ cls='error'; prefix='❌ '; }
        logDiv.innerHTML = `<span class="${cls}">${prefix}${msg}</span>`;
    };
    
    const fileToUint8Array = async (file) => {
        if(!file) throw new Error("No file selected");
        return new Uint8Array(await file.arrayBuffer());
    };
    
    const loadFFmpeg = async () => {
        loadBtn.disabled = true;
        log('Loading FFmpeg... (may take 15–40s first time)');
    
        try{
            ffmpeg = new FFmpegWASM.FFmpeg();
    
            ffmpeg.on('log', ({message}) => console.log('FFmpeg log:', message));
            ffmpeg.on('progress', ({progress}) => {
                log(`Progress: ${(progress*100).toFixed(1)}%`);
                updateProgressBar("merging", progress);
            });
    
            // Load core and worker from local files to avoid CORS issues
            await ffmpeg.load({
                corePath: 'ffmpeg-core.js',
                wasmPath: 'ffmpeg-core.wasm',
                workerPath: '814.ffmpeg.js'
            });
    
            log('FFmpeg loaded successfully!', 'success');
            mergeBtn.disabled = false;
            
            isLibLoaded = true;
            updateProgressBar("load-lib", 1);
            checkForMergeReady();
        } catch(err){
            console.error(err);
            log('Failed to load FFmpeg: ' + err.message,'error');
            loadBtn.disabled = false;
        }
    };
    
    const handleVideoSelect = (e) => {
        selectedVideoFile = e.target.files[0];
        if(selectedVideoFile){
            log(`Video selected: ${selectedVideoFile.name} (${(selectedVideoFile.size/(1024*1024)).toFixed(1)} MB)`);
        }
    };
    
    const handleAudioSelect = (e) => {
        selectedAudioFile = e.target.files[0];
        if(selectedAudioFile){
            log(`Audio selected: ${selectedAudioFile.name} (${(selectedAudioFile.size/(1024*1024)).toFixed(1)} MB)`);
        }
    };

    const mergeMessages = [
        "Merging video… please wait.",
        "Processing your video…",
        "Combining video segments…",
        "Hang tight, we’re stitching your video together!",
        "Almost done! Merging video files…",
        "Cooking up your video… this might take a moment.",
        "Magically combining your video… ✨",
        "Your masterpiece is being stitched together… 🎬",
        "Mixing pixels and frames… 🍿",
        "Video merge in progress… almost there!"
    ];

    // Function to get a random message
    function getRandomMergeMessage() {
        const index = Math.floor(Math.random() * mergeMessages.length);
        return mergeMessages[index];
    }
    let mergingVideoMessageInterval;
    
    const mergeVideoAndAudio = async () => {
        mergeBtn.disabled = true;
        const startMergeMessages = () => mergingVideoMessageInterval = setInterval(() => {
            updateProgressTitle(getRandomMergeMessage());          
        }, 5000);
        log('Starting merge...');
        let mergeStage = "Starting merge";
        try{
            mergeStage = "Loading video into FFmpeg";
            updateProgressTitle(mergeStage + "...");
            const videoData = vd;                                    //await fileToUint8Array(selectedVideoFile);
            console.log('[Finalizer] writeFile input_video START bytes=' + videoData.length);
            const videoWriteStarted = performance.now();
            await ffmpeg.writeFile('input_video', videoData);
            console.log('[Finalizer] writeFile input_video DONE ms=' + Math.round(performance.now() - videoWriteStarted));

            if(audioExists){
                mergeStage = "Loading audio into FFmpeg";
                updateProgressTitle(mergeStage + "...");
                const audioData = ad;                                //await fileToUint8Array(selectedAudioFile);
                console.log('[Finalizer] writeFile input_audio START bytes=' + audioData.length);
                const audioWriteStarted = performance.now();
                await ffmpeg.writeFile('input_audio', audioData);
                console.log('[Finalizer] writeFile input_audio DONE ms=' + Math.round(performance.now() - audioWriteStarted));
            }

            mergeStage = "Merging video and audio";
            updateProgressTitle(mergeStage + "...");
            console.log('[Finalizer] ffmpeg.exec START');
            const execStarted = performance.now();
            startMergeMessages();

            if (audioExists) {
                const exitCode = await ffmpeg.exec([
                    '-i', 'input_video',
                    '-i', 'input_audio',
                    '-map', '0:v:0',
                    '-map', '1:a:0',
                    '-c:v', 'copy',
                    '-c:a', 'copy',
                    '-shortest',
                    '-movflags', '+faststart',
                    'output_merged.mp4'
                ]);
            
                if (exitCode !== 0) {
                    throw new Error(`FFmpeg remux failed with exit code ${exitCode}`);
                }
            } else {
                const exitCode = await ffmpeg.exec([
                    '-i', 'input_video',
                    '-map', '0:v:0',
                    '-c:v', 'copy',
                    '-map', '0:a?',
                    '-c:a', 'copy',
                    '-movflags', '+faststart',
                    'output_merged.mp4'
                ]);
            
                if (exitCode !== 0) {
                    throw new Error(`FFmpeg remux failed with exit code ${exitCode}`);
                }
            }
    
            console.log('[Finalizer] ffmpeg.exec DONE ms=' + Math.round(performance.now() - execStarted));
            clearInterval(mergingVideoMessageInterval);
            mergingVideoMessageInterval = null;
            updateProgressBar("merging", 1);
            updateProgressTitle("Preparing final video...");

            const outputData = await ffmpeg.readFile('output_merged.mp4');
            const blob = new Blob([outputData.buffer], {type:'video/mp4'});
            videoEl.src = URL.createObjectURL(blob);

            await sendMergedVideoToFlutter(outputData);
            log('Merge completed successfully! Play the video above.','success');
        }catch(err){
            if(mergingVideoMessageInterval){
                clearInterval(mergingVideoMessageInterval);
                mergingVideoMessageInterval = null;
            }
            const errorMessage = err instanceof Error
                ? (err.stack || err.message || String(err))
                : String(err);
            console.error('[Finalizer] FAILED while: ' + mergeStage + '\n' + errorMessage, err);
            log('Merge failed: ' + errorMessage,'error');
            updateProgressTitle("Video processing failed");
            updateProgressErrText('Failed while: ' + mergeStage + '\n\n' + errorMessage);
        }finally{
            mergeBtn.disabled = false;
        }
    };
    
    window.addEventListener('load', ()=>{
        loadBtn = document.getElementById('load-button');
        mergeBtn = document.getElementById('merge-button');
        logDiv = document.getElementById('log-div');
        videoEl = document.getElementById('video-result');
    
        document.getElementById('video-input').addEventListener('change', handleVideoSelect);
        document.getElementById('audio-input').addEventListener('change', handleAudioSelect);
        loadBtn.addEventListener('click', loadFFmpeg);
        mergeBtn.addEventListener('click', mergeVideoAndAudio);
    
        log('Ready. Click "Load FFmpeg" to begin.');
    });
    
    let finalizerStarted = false;

    function startFinalizer(){
        if(finalizerStarted) return;
        finalizerStarted = true;
        console.log('[Finalizer] Flutter bridge ready; starting finalization');
        document.getElementById('load-button').click();
        fetchVideoAndAudioFiles().catch(function(e){
            console.error('[Finalizer] startup/fetch failed: ' + String(e));
            updateProgressTitle('Video processing failed');
            updateProgressErrText('Finalizer startup failed: ' + String(e));
        });
    }

    function waitForFlutterBridge(){
        if(window.flutter_inappwebview && typeof window.flutter_inappwebview.callHandler === 'function'){
            startFinalizer();
            return;
        }

        console.log('[Finalizer] waiting for Flutter JavaScript bridge');
        window.addEventListener('flutterInAppWebViewPlatformReady', function(){
            console.log('[Finalizer] flutterInAppWebViewPlatformReady received');
            startFinalizer();
        }, {once: true});

        setTimeout(function(){
            if(!finalizerStarted){
                if(window.flutter_inappwebview && typeof window.flutter_inappwebview.callHandler === 'function'){
                    startFinalizer();
                } else {
                    console.error('[Finalizer] Flutter JavaScript bridge unavailable after 10 seconds');
                    updateProgressTitle('Video processing failed');
                    updateProgressErrText('Flutter JavaScript bridge did not become ready. Please reopen the finalizer and try again.');
                }
            }
        }, 10000);
    }

    window.addEventListener('load', waitForFlutterBridge);
    
    const progressBar = document.getElementById('progress');
    const progressTitle = document.getElementById('progress-title');
    const progressText = document.getElementById('progress-text');
    const progressErrText = document.getElementById('progress-err-text');
    const progressDoneText = document.getElementById('progress-done-text');
    let progressBarStatus = {"video-download": 0, "audio-download": 0, "load-lib": 0, "merging": 0, "video-upload": 0};
    
    // Progress Bar Update
    function updateProgressBar(type, percentageValue){
        // percentageValue is of value between 0 - 1
        progressBarStatus[type] = Math.min(parseFloat(percentageValue), 1);
        setProgress(calculateProgressBar());
        updateProgressLiquidColor(calculateProgressBar());
    }

    function updateProgressTitle(text){
        progressTitle.textContent = text;
    }

    function updateProgressErrText(text){
        progressErrText.textContent = text;
    }

    function updateProgressDoneText(text){
        updateProgressDoneColor();
        progressDoneText.textContent = text;
    }

    function updateProgressDoneColor(){
        // progressBar.style.background = "linear-gradient(90deg, rgb(57, 209, 5), rgb(78, 249, 8))";
    }

    function updateProgressLiquidColor(progress){
      // Calculate RGB from red to green
      const r = Math.round(255 * (1 - progress / 100));
      const g = Math.round(255 * (progress / 100));
      const b = 0;
         
      document.querySelector('.liquid-bg').children[0].style.background = `rgba(${r}, ${g}, ${b}, 0.15)`;
      document.querySelector('.liquid-bg').children[1].style.background = `rgba(${r}, ${g}, ${b}, 0.15)`;
      document.querySelector('.liquid-bg').children[2].style.background = `rgba(${r}, ${g}, ${b}, 0.15)`;
    }

    function calculateProgressBar() {
        return Math.min((progressBarStatus["video-download"] * 0.15 + progressBarStatus["audio-download"] * 0.15 + progressBarStatus["load-lib"] * 0.1 + progressBarStatus["merging"] * 0.3 + progressBarStatus["video-upload"] * 0.3) * 100, 100); 
    }

    function setProgress(percent) {
      if (percent < 0) percent = 0;
      if (percent > 100) percent = 100;
      
      progressBar.style.width = percent.toFixed(2) + '%';
      progressText.textContent = percent.toFixed(2) + '%';
    }

</script>
</body>
</html>
